name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Validate migration registry
        run: npm run migration:list
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
